<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Activity 3 - Interactive Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .search-container {
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 8px;
            width: 250px;
            font-size: 14px;
        }
        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 450px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Lab Activity 3: Displaying Map with User Input</h2>

    <div class="search-container">
        <input type="text" id="cityInput" placeholder="Enter city or place (e.g., Manila)">
        <button onclick="updateMap()">Display Location</button>
    </div>

    <iframe id="mapFrame" src="https://maps.google.com/maps?q=Manila&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

    <script>
        function updateMap() {
            let location = document.getElementById("cityInput").value.trim();

            if (!location) {
                alert("Please enter a location.");
                return;
            }

            let mapFrame = document.getElementById("mapFrame");
            mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(location)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
        }
    </script>

</body>
</html>
